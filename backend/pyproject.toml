[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homecoach"
version = "0.1.0"
description = "Self-hosted training dashboard and plan engine for wearable data"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "fitdecode>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.5", "mypy>=1.15", "respx>=0.21", "httpx2>=2.16", "pyyaml>=6"]  # httpx2: what starlette.testclient uses

[project.scripts]
homecoach = "homecoach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homecoach"]
artifacts = ["src/homecoach/migrations/*.mako"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PERF", "RUF"]
# ×, – and similar characters are deliberate in user-facing text
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "fitdecode.*"]  # no type stubs published
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# a leaked connection or file handle is a bug: fail the test run instead of printing a warning
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["homecoach"]
omit = ["*/migrations/*"]  # run by the migration smoke test in CI, not by pytest

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
