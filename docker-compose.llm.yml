# Optional local AI for the race assistant and the coach: Ollama (LLM) + SearXNG (web search).
# Use together with docker-compose.yml, and set HC_LLM_PROVIDER=openai in .env.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"   # the coach's context is a few thousand tokens
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "15m"        # unload from RAM when idle
    volumes:
      - ${HC_OLLAMA_PATH:-./data/ollama}:/root/.ollama

  ollama-pull:  # downloads the model once (and updates it on restart), then exits
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull ${HC_LLM_MODEL:-qwen2.5:3b}"]
    depends_on: [ollama]

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
