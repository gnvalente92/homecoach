# Optional Grafana, pointed at the homecoach Postgres. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.grafana.yml up -d
services:
  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      HC_PG_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${GRAFANA_PORT:-3742}:3000"
    volumes:
      - ${HC_GRAFANA_PATH:-./data/grafana}:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      db: { condition: service_healthy }
